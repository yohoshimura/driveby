[package]
name = "driveby"
version = "1.7.2"
edition = "2021"
description = "Desktop backup application"
authors = ["ysh"]
license = "MIT"
repository = "https://github.com/yohoshimura/driveby"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
futures-util = "0.3"
regex = "1"
filetime = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
# `test` brings in tauri::test::mock_app(), which lets the backup and restore
# pipelines be driven end to end without a real webview.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "test"] }
tempfile = "3"
# `test-util` is what lets the rate-limiter tests drive tokio's clock instead
# of sleeping through the seconds they are asserting about.
tokio = { version = "1", features = ["full", "test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[[bin]]
name = "driveby"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
