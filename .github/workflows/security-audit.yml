name: Security audit

# OWASP DevSecOps 2-3-2 SCA "on a schedule": advisories are published daily
# against dependencies that were clean when they merged. This re-checks master
# every morning without waiting for a push. A failure here is the signal to
# cut a patch release (2-7-4 remediation targets; SECURITY.md).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  rust-advisories:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories

  npm-advisories:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
