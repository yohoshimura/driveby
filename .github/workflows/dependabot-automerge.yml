name: Dependabot auto-merge

# OWASP DevSecOps 2-7-4 (vulnerability management) and 2-3-5 (security
# gates): a Dependabot patch or minor update merges itself, but only once
# every status check the master ruleset requires has passed. Nothing is
# merged here directly: `gh pr merge --auto` hands the decision to GitHub,
# which waits for the checks and merges nothing that fails them.
#
# Left for a person, on purpose:
#   - major versions (React 18 -> 19, tauri-action 0 -> 1): breaking changes
#     need reading and a click through the app;
#   - github-actions updates: the workflow token cannot merge changes to
#     .github/workflows, and a pin moving to new code deserves a look;
#   - a Tauri minor update that lands on only one side (Rust or npm): the
#     version-match test fails it until both sides are combined.
#
# Requires, in Settings: "Allow auto-merge", and a ruleset on master that
# requires the CI checks (without required checks there is nothing to wait
# for, and auto-merge would merge immediately).

on: pull_request

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    # The PR's author rather than github.actor: a re-run started by someone
    # else must not count as Dependabot, and a fork is not this repository.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'yohoshimura/driveby'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write      # the eventual merge
      pull-requests: write # turning auto-merge on
    steps:
      - name: Read the update's metadata
        id: meta
        uses: dependabot/fetch-metadata@ffa630c65fa7e0ecfa0625b5ceda64399aea1b36 # v3.0.0

      - name: Merge patch and minor updates once the required checks pass
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
