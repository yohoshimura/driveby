name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    # workflow_dispatch runs against whatever ref was picked, so a manual run
    # from master used to draft a release literally tagged `master`, complete
    # with installers and a latest.json that the updater endpoint would then
    # serve (#F8). Dispatch is still available — it just has to target a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Each job merges its own platform into the shared latest.json and
      # re-uploads it. Running them one at a time removes any chance of two
      # read-modify-writes overlapping and dropping a platform's entry, at
      # the cost of a slower release (#F9).
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            label: Windows (msi + nsis)
            args: ''
          - os: macos-latest
            label: macOS (universal)
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            label: Linux (AppImage + deb)
            args: ''
    steps:
      - uses: actions/checkout@v4

      # tauri.conf.json deliberately carries no version; the bundle version
      # comes from Cargo.toml, which only scripts/bump-version.mjs updates —
      # by hand. Tagging without running it produced a green release named
      # v1.7.0 that shipped 1.6.1 binaries and a latest.json pinned to
      # 1.6.1, so every client reported "up to date" forever (#F3).
      - name: Tag must match the manifests
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          cargo="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag  package.json=$pkg  Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::version mismatch - run 'npm run bump-version $tag', commit, and re-tag"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set both to sign the update artifacts. Without them the build
          # still succeeds — it just produces no updater bundle, because
          # updater.conf.json is only layered in when the key is present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'driveby ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for what changed in this release.'
          releaseDraft: true
          prerelease: false
          args: >-
            ${{ matrix.args }}
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
