name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — tests + frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # The case-*sensitive* half of the contract, and the only runner that can
  # build the fixture for it: two directories differing only in case. It also
  # compiles the readdir-based NameResolver, which is shared with macOS.
  linux:
    name: Linux — tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libgtk-3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tauri::generate_context! reads frontendDist, so dist/ must exist
      # before the Rust tests compile.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Driveby ships a universal .dmg, so until now the only thing that ever
  # compiled the macOS target was the release build — after the tag, when a
  # failure is expensive. The case-folding paths (recase_dirs_phase, the
  # NameResolver, the overlap fold) are live on APFS and reachable nowhere
  # else, and ActivationPolicy is macOS-only by definition.
  macos:
    name: macOS — tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
