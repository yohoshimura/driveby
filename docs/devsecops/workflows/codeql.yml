name: CodeQL

# SAST (OWASP DevSecOps 2-3-1-1): CodeQL's dataflow analysis over the
# React frontend, the Rust backend and the workflow files themselves, on every
# PR (diff-aware alerts in the PR) and weekly over the whole tree (new queries
# against old code). Results land in Security → Code scanning, free for a
# public repository.
#
# Alternative with no file at all: Settings → Code security → CodeQL
# analysis → "Default setup" picks the same three languages. Use this file
# instead when you want the security-extended suite or to pin the action.
#
# Start in report-only mode (2-3-1-1 "establish baseline"); after triaging the
# first run, add a code-scanning merge-protection rule for high/critical
# alerts in the master ruleset (2-3-5).

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build is needed (build-mode: none), but the Rust extractor runs
      # build scripts through rust-analyzer; gtk-sys and friends need the
      # system libraries to get past pkg-config.
      - name: Install Tauri system dependencies (Rust only)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libgtk-3-dev

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
